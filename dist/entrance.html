<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Richmount | Entrance Diagnostic</title><link rel="stylesheet" href="style.css"><style>
.diag{max-width:950px;margin:35px auto;padding:22px}.diag h1{font-size:2.25rem}.diag-panel{background:#fff;border:1px solid #dce8e3;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 4px 15px #143d3310}.diag-options{display:grid;gap:10px;margin-top:16px}.diag-option{border:1px solid #ccdcd6;padding:12px 15px;border-radius:9px;display:flex;gap:12px;align-items:center;cursor:pointer}.diag-option:has(input:checked){border-color:#286c53;background:#eef8f2}.diag-actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:22px 0}.diag button{border:0;border-radius:9px;background:#235f4e;color:white;padding:12px 20px;cursor:pointer}.diag button:disabled{opacity:.4}.diag .outline{background:#e5eee9;color:#153d33}.diag .hint{color:#50655d;font-size:.95rem}.diag .passage{line-height:1.7;background:#f3f7f5;border-left:4px solid #3b806a;padding:18px;white-space:pre-line}.diag .progress-track{height:8px;background:#e6ede9;border-radius:8px;overflow:hidden}.diag .progress-fill{height:100%;background:#277b61}.diag .question-type{text-transform:uppercase;color:#2b745c;font-weight:700;letter-spacing:.12em;font-size:.8rem}.diag input[type=text]{padding:12px;border:1px solid #afc7ba;border-radius:8px;width:100%;max-width:500px}.diag .metric{display:inline-block;margin:8px 15px 8px 0;font-size:1.15rem}.diag table{width:100%;border-collapse:collapse}.diag td,.diag th{padding:10px;text-align:left;border-bottom:1px solid #dce8e3}@media print{.sidebar,.topbar,footer,.diag-actions,.hide-print{display:none!important}.main-wrap{width:100%}.diag{margin:0}.diag-panel{box-shadow:none}}</style></head>
<body><main class="diag" id="diagnostic"></main><script type="module" src="entrance.js"></script></body></html>
